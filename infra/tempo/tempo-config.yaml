server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.x substituiu o bloco `ingester` pelo `live_store` no modo monolítico.
live_store:
  max_trace_idle: 10s
  max_block_bytes: 100000
  max_block_duration: 5m

# Tempo 3.x substituiu o bloco `compactor` por jobs agendados.
backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
